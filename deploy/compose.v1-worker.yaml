# SVC V1 only. The V2 deployment is owned separately and must not be selected here.
name: seed-vc-v1-worker
services:
  svc-v1:
    image: registry.ttd/seed-vc/svc:h-1ec093c04a6f@sha256:e01468f9477df0f859ebaec0b508e24c87f7bd856487852924efd34b7e9f4ffe
    container_name: svc-v1
    command: ["python", "api2.py"]
    working_dir: /app
    environment:
      LC_ALL: C.UTF-8
      TZ: Asia/Shanghai
      VC_ROOT: /data/ttd/seed-vc
      MODEL_TIMEOUT_SECONDS: "7200"
    volumes:
      - /TTD-Data/seed-vc:/data/ttd/seed-vc
      - /TTD-Data/seed-vc/checkpoints:/app/checkpoints
      - /TTD-Data/seed-vc/cache:/root/.cache
    shm_size: 16G
    restart: always
    networks: [caddy]
    labels:
      caddy_network: caddy
      caddy_0: http://svc-api
      caddy_0.reverse_proxy: "{{upstreams 7856}}"
      caddy_1: http://seed-vc
      "caddy_1.@svc_v1.path": "/v1 /v1/*"
      caddy_1.route: "@svc_v1"
      caddy_1.route.0_uri: "strip_prefix /v1"
      caddy_1.route.1_reverse_proxy: "{{upstreams 7856}}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
networks:
  caddy:
    external: true
