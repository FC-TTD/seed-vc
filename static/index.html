<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百灵 · Seed-VC 双版本测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f8;
      --panel: #ffffff;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #f97316;
      --accent-soft: #fff7ed;
      --blue: #2563eb;
      --wave: #4f6fd8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 64px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); line-height: 1.08; letter-spacing: -.03em; }
    .lead, .note { margin: 0; color: var(--muted); line-height: 1.65; }
    .badge { white-space: nowrap; border: 1px solid #bbf7d0; color: #15803d; background: #f0fdf4; border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .tab { border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); padding: 12px 18px 10px; font-weight: 700; cursor: pointer; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-shell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 1px 2px #0000000d; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
    h2 { margin: 0 0 6px; font-size: 22px; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 7px; color: #374151; font-size: 14px; font-weight: 600; }
    .field small { color: var(--muted); font-weight: 400; }
    input[type="number"] { width: 100%; border: 1px solid var(--line-strong); background: white; color: var(--text); padding: 10px 11px; border-radius: 8px; outline: none; }
    input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #fed7aa66; }
    .check { flex-direction: row; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fafafa; }
    .check input { accent-color: var(--accent); }
    .wide { grid-column: 1 / -1; }
    .audio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; grid-column: 1 / -1; }
    .audio-wrap > .audio-label { display: flex; align-items: center; gap: 7px; margin: 0 0 8px; font-size: 14px; font-weight: 700; }
    .audio-wrap > .audio-label::before { content: "♫"; color: var(--muted); }
    .audio-editor { position: relative; min-height: 228px; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: white; }
    .audio-file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .drop-zone { min-height: 226px; width: 100%; border: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); cursor: pointer; }
    .drop-zone:hover, .drop-zone.dragging { background: #fffaf5; color: var(--accent); }
    .upload-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 23px; }
    .drop-zone strong { color: #4b5563; }
    .drop-zone span { font-size: 13px; }
    .example-audio { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; border: 0; background: transparent; color: var(--blue); font-size: 12px; font-weight: 700; cursor: pointer; }
    .editor-ui { display: none; }
    .audio-editor.loaded .drop-zone { display: none; }
    .audio-editor.loaded .example-audio { display: none; }
    .audio-editor.loaded .editor-ui { display: block; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafafa; }
    .file-meta { min-width: 0; }
    .file-name { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-detail { color: var(--muted); font-size: 12px; }
    .icon-button { border: 1px solid var(--line); background: white; color: #4b5563; width: 30px; height: 30px; border-radius: 7px; cursor: pointer; }
    .wave-stage { position: relative; padding: 12px 12px 6px; background: white; }
    .wave-canvas { display: block; width: 100%; height: 82px; border-radius: 6px; background: #f8fafc; cursor: crosshair; touch-action: none; }
    .wave-help { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding-top: 5px; }
    .player-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
    .play-button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: white; cursor: pointer; font-size: 15px; }
    .seek { accent-color: var(--accent); width: 100%; }
    .clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
    .trim-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; align-items: end; padding: 10px 12px 12px; background: #fafafa; border-top: 1px solid var(--line); }
    .time-field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; }
    .time-field input { min-width: 0; padding: 7px 8px; font-size: 12px; }
    .small-button { border: 1px solid var(--line-strong); background: white; color: #374151; border-radius: 7px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .small-button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .small-button:disabled { opacity: .45; cursor: not-allowed; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
    .submit { min-width: 190px; border: 0; border-radius: 8px; padding: 12px 20px; color: white; font-weight: 800; background: var(--accent); cursor: pointer; }
    .submit:hover { background: #ea580c; }
    .submit:disabled { opacity: .55; cursor: wait; }
    .status { color: var(--muted); font-size: 14px; }
    .result { display: none; grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 9px; padding: 14px; background: #fafafa; }
    .result strong { display: block; margin-bottom: 9px; }
    .result audio { width: 100%; }
    @media (max-width: 780px) {
      main { width: min(100% - 20px, 680px); margin-top: 18px; }
      header, .panel-head { flex-direction: column; }
      form, .audio-grid { grid-template-columns: 1fr; }
      .wide, .audio-grid, .result { grid-column: auto; }
      .panel-shell { padding: 14px; }
      .trim-row { grid-template-columns: 1fr 1fr; }
      .small-button { width: 100%; }
      .actions { flex-direction: column; align-items: stretch; }
      .submit { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>百灵 · Seed-VC</h1>
      <p class="lead">在同一工作台对比 v1.0 与 v2.0。上传后可试听波形、选择区间并裁剪，再将处理后的音频提交转换。</p>
    </div>
    <span class="badge">ttd-edge · GPU2 · 在线</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Seed-VC 模型版本">
    <button class="tab active" type="button" data-tab="v1">Seed-VC v1.0</button>
    <button class="tab" type="button" data-tab="v2">Seed-VC v2.0</button>
  </nav>

  <section class="panel active" id="v1">
    <div class="panel-shell">
      <div class="panel-head">
        <div><h2>v1.0 · 音色 / 歌声转换</h2><p class="note">保留普通 VC、F0 与歌声转换能力。</p></div>
      </div>
      <form data-endpoint="/api/v1/convert">
        <div class="audio-grid">
          <div class="audio-wrap"><div class="audio-label">源音频</div><div class="audio-editor" data-field="source_file"></div></div>
          <div class="audio-wrap"><div class="audio-label">参考音色</div><div class="audio-editor" data-field="reference_file"></div></div>
        </div>
        <label class="field">扩散步数<input type="number" name="diffusion_steps" value="25" min="1" max="200"><small>数值越高越精细，也越慢。</small></label>
        <label class="field">时长系数<input type="number" name="length_adjust" value="1.0" min="0.5" max="2" step="0.1"><small>&lt;1 加速，&gt;1 减速。</small></label>
        <label class="field">CFG<input type="number" name="inference_cfg_rate" value="0.7" min="0" max="1" step="0.1"></label>
        <label class="field">升降调（半音）<input type="number" name="pitch_shift" value="0" min="-24" max="24"></label>
        <label class="field check"><input type="checkbox" name="f0_conditioned">启用 F0（歌声转换）</label>
        <label class="field check"><input type="checkbox" name="auto_f0_adjust">自动调整 F0</label>
        <div class="actions wide"><button class="submit" type="submit">开始转换 v1.0</button><span class="status">请先上传源音频和参考音色</span></div>
      </form>
      <div class="result"><strong>输出音频</strong><audio controls></audio></div>
    </div>
  </section>

  <section class="panel" id="v2">
    <div class="panel-shell">
      <div class="panel-head">
        <div><h2>v2.0 · 音色 / 风格 / 口音转换</h2><p class="note">首次请求会懒加载；开启风格转换后使用 AR 模型处理情绪和口音。</p></div>
      </div>
      <form data-endpoint="/api/v2/convert">
        <div class="audio-grid">
          <div class="audio-wrap"><div class="audio-label">源音频</div><div class="audio-editor" data-field="source_file"></div></div>
          <div class="audio-wrap"><div class="audio-label">参考音色</div><div class="audio-editor" data-field="reference_file"></div></div>
        </div>
        <label class="field">扩散步数<input type="number" name="diffusion_steps" value="30" min="1" max="200"></label>
        <label class="field">时长系数<input type="number" name="length_adjust" value="1.0" min="0.5" max="2" step="0.1"></label>
        <label class="field">清晰度 CFG<input type="number" name="intelligibility_cfg_rate" value="0.0" min="0" max="1" step="0.1"></label>
        <label class="field">相似度 CFG<input type="number" name="similarity_cfg_rate" value="0.7" min="0" max="1" step="0.1"></label>
        <label class="field">Top-p<input type="number" name="top_p" value="0.9" min="0.1" max="1" step="0.1"></label>
        <label class="field">Temperature<input type="number" name="temperature" value="1.0" min="0.1" max="2" step="0.1"></label>
        <label class="field">重复惩罚<input type="number" name="repetition_penalty" value="1.0" min="1" max="3" step="0.1"></label>
        <label class="field check"><input type="checkbox" name="convert_style">转换风格 / 情绪 / 口音</label>
        <label class="field check"><input type="checkbox" name="anonymization_only">仅匿名化</label>
        <div class="actions wide"><button class="submit" type="submit">开始转换 v2.0</button><span class="status">请先上传源音频和参考音色</span></div>
      </form>
      <div class="result"><strong>输出音频</strong><audio controls></audio></div>
    </div>
  </section>
</main>

<template id="audio-editor-template">
  <input class="audio-file-input" type="file" accept="audio/*">
  <button class="drop-zone" type="button">
    <span class="upload-icon">↥</span>
    <strong>将音频拖放到此处</strong>
    <span>— 或 —</span>
    <span>点击上传</span>
  </button>
  <button class="example-audio" type="button">加载示例音频</button>
  <div class="editor-ui">
    <div class="editor-top">
      <div class="file-meta"><span class="file-name"></span><span class="file-detail"></span></div>
      <button class="icon-button clear-audio" type="button" aria-label="清除音频">×</button>
    </div>
    <div class="wave-stage">
      <canvas class="wave-canvas" width="720" height="164" aria-label="音频波形与裁剪选区"></canvas>
      <div class="wave-help"><span>拖动橙色边界调整选区</span><span class="selection-label"></span></div>
    </div>
    <div class="player-row">
      <button class="play-button" type="button" aria-label="播放音频">▶</button>
      <input class="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度">
      <span class="clock">00:00 / 00:00</span>
    </div>
    <div class="trim-row">
      <label class="time-field">开始（秒）<input class="trim-start" type="number" min="0" step="0.01" value="0"></label>
      <label class="time-field">结束（秒）<input class="trim-end" type="number" min="0" step="0.01" value="0"></label>
      <button class="small-button reset-selection" type="button">重置选区</button>
      <button class="small-button primary apply-trim" type="button">裁剪选区</button>
    </div>
    <audio class="native-audio" preload="metadata"></audio>
  </div>
</template>

<script>
  const pad = value => String(Math.floor(value)).padStart(2, '0');
  const formatTime = value => `${pad(value / 60)}:${pad(value % 60)}`;
  const editorGroups = { v1: {}, v2: {} };

  function encodeWav(buffer, startTime, endTime) {
    const rate = buffer.sampleRate;
    const start = Math.max(0, Math.floor(startTime * rate));
    const end = Math.min(buffer.length, Math.ceil(endTime * rate));
    const frames = Math.max(1, end - start);
    const channels = buffer.numberOfChannels;
    const bytes = new ArrayBuffer(44 + frames * channels * 2);
    const view = new DataView(bytes);
    const text = (offset, value) => [...value].forEach((char, i) => view.setUint8(offset + i, char.charCodeAt(0)));
    text(0, 'RIFF'); view.setUint32(4, 36 + frames * channels * 2, true); text(8, 'WAVE'); text(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, channels, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * channels * 2, true); view.setUint16(32, channels * 2, true);
    view.setUint16(34, 16, true); text(36, 'data'); view.setUint32(40, frames * channels * 2, true);
    let offset = 44;
    for (let i = start; i < end; i++) for (let channel = 0; channel < channels; channel++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true); offset += 2;
    }
    return new Blob([bytes], { type: 'audio/wav' });
  }

  class AudioEditor {
    constructor(root) {
      this.root = root; this.field = root.dataset.field; this.file = null; this.buffer = null; this.url = null;
      this.duration = 0; this.start = 0; this.end = 0; this.dragHandle = null;
      this.group = root.closest('.panel').id; editorGroups[this.group][this.field] = this;
      root.append(document.getElementById('audio-editor-template').content.cloneNode(true));
      this.input = root.querySelector('.audio-file-input'); this.drop = root.querySelector('.drop-zone');
      this.input.name = this.field;
      this.audio = root.querySelector('.native-audio'); this.canvas = root.querySelector('.wave-canvas'); this.ctx = this.canvas.getContext('2d');
      this.play = root.querySelector('.play-button'); this.seek = root.querySelector('.seek'); this.clock = root.querySelector('.clock');
      this.startInput = root.querySelector('.trim-start'); this.endInput = root.querySelector('.trim-end');
      this.name = root.querySelector('.file-name'); this.detail = root.querySelector('.file-detail'); this.selection = root.querySelector('.selection-label');
      this.bind();
    }
    bind() {
      this.drop.addEventListener('click', () => this.input.click());
      this.root.querySelector('.example-audio').addEventListener('click', () => this.loadExample());
      this.input.addEventListener('change', () => this.input.files[0] && this.load(this.input.files[0]));
      ['dragenter', 'dragover'].forEach(type => this.drop.addEventListener(type, event => { event.preventDefault(); this.drop.classList.add('dragging'); }));
      ['dragleave', 'drop'].forEach(type => this.drop.addEventListener(type, event => { event.preventDefault(); this.drop.classList.remove('dragging'); }));
      this.drop.addEventListener('drop', event => event.dataTransfer.files[0] && this.load(event.dataTransfer.files[0]));
      this.root.querySelector('.clear-audio').addEventListener('click', () => this.clear());
      this.play.addEventListener('click', () => this.audio.paused ? this.audio.play() : this.audio.pause());
      this.audio.addEventListener('play', () => { this.play.textContent = '❚❚'; this.play.setAttribute('aria-label', '暂停音频'); });
      this.audio.addEventListener('pause', () => { this.play.textContent = '▶'; this.play.setAttribute('aria-label', '播放音频'); });
      this.audio.addEventListener('timeupdate', () => this.updatePlayer());
      this.audio.addEventListener('ended', () => { this.audio.currentTime = this.start; this.updatePlayer(); });
      this.seek.addEventListener('input', () => { this.audio.currentTime = Number(this.seek.value); this.updatePlayer(); });
      this.startInput.addEventListener('input', () => this.updateSelection(Number(this.startInput.value), this.end));
      this.endInput.addEventListener('input', () => this.updateSelection(this.start, Number(this.endInput.value)));
      this.root.querySelector('.reset-selection').addEventListener('click', () => this.updateSelection(0, this.duration));
      this.root.querySelector('.apply-trim').addEventListener('click', () => this.trim());
      this.canvas.addEventListener('pointerdown', event => this.pointerStart(event));
      this.canvas.addEventListener('pointermove', event => this.pointerMove(event));
      this.canvas.addEventListener('pointerup', () => this.dragHandle = null);
      this.canvas.addEventListener('pointercancel', () => this.dragHandle = null);
      window.addEventListener('resize', () => this.draw());
    }
    async load(file) {
      if (!file.type.startsWith('audio/') && !/\.(wav|mp3|m4a|flac|ogg|opus)$/i.test(file.name)) return;
      this.file = file;
      const transfer = new DataTransfer(); transfer.items.add(file); this.input.files = transfer.files;
      if (this.url) URL.revokeObjectURL(this.url); this.url = URL.createObjectURL(file); this.audio.src = this.url;
      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        this.buffer = await context.decodeAudioData(await file.arrayBuffer()); this.duration = this.buffer.duration; await context.close();
        this.start = 0; this.end = this.duration; this.name.textContent = file.name;
        this.detail.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · ${this.duration.toFixed(2)} 秒`;
        this.seek.max = this.duration; this.startInput.max = this.duration; this.endInput.max = this.duration;
        this.root.classList.add('loaded'); this.updateSelection(0, this.duration); this.updatePlayer(); this.draw();
      } catch (error) { this.clear(); alert(`无法读取音频：${error.message}`); }
    }
    async loadExample() {
      const kind = this.field === 'source_file' ? 'source' : 'reference';
      const response = await fetch(`/examples/${kind}.wav`); if (!response.ok) return;
      await this.load(new File([await response.blob()], `${kind}-example.wav`, { type: 'audio/wav' }));
    }
    clear() {
      this.audio.pause(); this.input.value = ''; this.file = null; this.buffer = null; this.duration = 0;
      if (this.url) URL.revokeObjectURL(this.url); this.url = null; this.root.classList.remove('loaded');
    }
    updateSelection(start, end) {
      this.start = Math.max(0, Math.min(Number.isFinite(start) ? start : 0, this.duration));
      this.end = Math.max(this.start + Math.min(.01, this.duration), Math.min(Number.isFinite(end) ? end : this.duration, this.duration));
      this.startInput.value = this.start.toFixed(2); this.endInput.value = this.end.toFixed(2);
      this.selection.textContent = `${this.start.toFixed(2)}s — ${this.end.toFixed(2)}s`;
      if (this.audio.currentTime < this.start || this.audio.currentTime > this.end) this.audio.currentTime = this.start;
      this.draw(); this.updatePlayer();
    }
    updatePlayer() {
      if (!this.duration) return;
      if (this.audio.currentTime > this.end) { this.audio.pause(); this.audio.currentTime = this.start; }
      this.seek.value = this.audio.currentTime; this.clock.textContent = `${formatTime(this.audio.currentTime)} / ${formatTime(this.duration)}`;
      this.draw();
    }
    pointerTime(event) {
      const rect = this.canvas.getBoundingClientRect(); return Math.max(0, Math.min(this.duration, (event.clientX - rect.left) / rect.width * this.duration));
    }
    pointerStart(event) {
      if (!this.duration) return; const time = this.pointerTime(event);
      this.dragHandle = Math.abs(time - this.start) <= Math.abs(time - this.end) ? 'start' : 'end';
      this.canvas.setPointerCapture(event.pointerId); this.pointerMove(event);
    }
    pointerMove(event) {
      if (!this.dragHandle) return; const time = this.pointerTime(event);
      this.dragHandle === 'start' ? this.updateSelection(Math.min(time, this.end - .01), this.end) : this.updateSelection(this.start, Math.max(time, this.start + .01));
    }
    draw() {
      if (!this.buffer) return; const { width, height } = this.canvas; const ctx = this.ctx; ctx.clearRect(0, 0, width, height);
      const data = this.buffer.getChannelData(0); const step = Math.max(1, Math.floor(data.length / width)); const middle = height / 2;
      ctx.strokeStyle = '#aab4c8'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = 0; x < width; x++) { let min = 1, max = -1; const offset = x * step; for (let i = 0; i < step; i++) { const sample = data[offset + i] || 0; min = Math.min(min, sample); max = Math.max(max, sample); } ctx.moveTo(x, middle + min * middle * .82); ctx.lineTo(x, middle + max * middle * .82); }
      ctx.stroke(); const sx = this.start / this.duration * width, ex = this.end / this.duration * width;
      ctx.fillStyle = '#f9731620'; ctx.fillRect(sx, 0, ex - sx, height); ctx.fillStyle = '#00000018'; ctx.fillRect(0, 0, sx, height); ctx.fillRect(ex, 0, width - ex, height);
      ctx.strokeStyle = '#f97316'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, height); ctx.moveTo(ex, 0); ctx.lineTo(ex, height); ctx.stroke();
      const px = this.audio.currentTime / this.duration * width; ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
    }
    async trim() {
      if (!this.buffer || this.end - this.start < .05) return;
      const blob = encodeWav(this.buffer, this.start, this.end); const base = this.file.name.replace(/\.[^.]+$/, '');
      await this.load(new File([blob], `${base}-trimmed.wav`, { type: 'audio/wav' }));
    }
  }

  document.querySelectorAll('.audio-editor').forEach(root => new AudioEditor(root));
  document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('.tab,.panel').forEach(node => node.classList.remove('active'));
    button.classList.add('active'); document.getElementById(button.dataset.tab).classList.add('active');
  }));
  document.querySelectorAll('form').forEach(form => {
    form.addEventListener('submit', event => event.preventDefault());
    form.querySelector('.submit').addEventListener('click', async event => {
    event.preventDefault(); const group = form.closest('.panel').id; const formEditors = Object.values(editorGroups[group]);
    const missing = formEditors.find(editor => !editor.file); const status = form.querySelector('.status');
    if (missing) { status.textContent = '请先上传源音频和参考音色'; return; }
    const button = form.querySelector('.submit'), panel = form.closest('.panel-shell'), result = panel.querySelector('.result'), output = result.querySelector('audio');
    button.disabled = true; status.textContent = '模型处理中，请勿重复提交…'; result.style.display = 'none';
    const data = new FormData(form); formEditors.forEach(editor => data.set(editor.field, editor.file, editor.file.name));
    form.querySelectorAll('input[type=checkbox]').forEach(box => data.set(box.name, box.checked ? 'true' : 'false'));
    try {
      const response = await fetch(form.dataset.endpoint, { method: 'POST', body: data });
      if (!response.ok) { let message = await response.text(); try { message = JSON.parse(message).detail || message; } catch {} throw new Error(message); }
      const blob = await response.blob(); if (output.src) URL.revokeObjectURL(output.src); output.src = URL.createObjectURL(blob); result.style.display = 'block';
      status.textContent = `完成 · ${(blob.size / 1024 / 1024).toFixed(2)} MB`;
    } catch (error) { status.textContent = `失败：${error.message}`; }
    finally { button.disabled = false; }
    });
  });
</script>
</body>
