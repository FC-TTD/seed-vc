<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seed-VC 双版本测试</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#141b2d; --line:#2a3550; --text:#eef3ff; --muted:#9ba9c6; --accent:#7c9cff; --accent2:#74e0c1; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; background:radial-gradient(circle at 20% 0,#1b2b52 0,transparent 35%),var(--bg); color:var(--text); }
    main { width:min(1120px,calc(100% - 32px)); margin:48px auto 72px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:flex-end; margin-bottom:28px; }
    h1 { font-size:clamp(30px,5vw,52px); margin:0 0 8px; letter-spacing:-.04em; }
    .lead { color:var(--muted); margin:0; max-width:720px; line-height:1.7; }
    .badge { white-space:nowrap; border:1px solid var(--line); background:#11182a99; padding:9px 13px; border-radius:999px; color:var(--accent2); }
    .tabs { display:flex; gap:8px; padding:6px; width:fit-content; border:1px solid var(--line); background:#0d1425cc; border-radius:14px; margin-bottom:18px; }
    .tab { border:0; color:var(--muted); background:transparent; padding:11px 18px; border-radius:10px; font-weight:700; cursor:pointer; }
    .tab.active { color:white; background:linear-gradient(135deg,#536fd6,#7655c6); box-shadow:0 8px 24px #171f4888; }
    .panel { display:none; background:linear-gradient(180deg,#161e33ee,#101728ee); border:1px solid var(--line); border-radius:20px; padding:24px; box-shadow:0 24px 70px #02061166; }
    .panel.active { display:block; }
    .panel-head { display:flex; justify-content:space-between; align-items:start; gap:20px; margin-bottom:20px; }
    h2 { margin:0 0 7px; font-size:24px; }
    .note { color:var(--muted); line-height:1.6; margin:0; }
    form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    label { display:flex; flex-direction:column; gap:8px; color:#c8d2e8; font-size:14px; }
    input, select { width:100%; border:1px solid var(--line); border-radius:11px; background:#0b1222; color:var(--text); padding:11px 12px; }
    input[type=file] { padding:9px; }
    input[type=checkbox] { width:auto; accent-color:var(--accent); }
    .check { flex-direction:row; align-items:center; padding-top:28px; }
    .wide { grid-column:1/-1; }
    .actions { display:flex; align-items:center; gap:14px; margin-top:6px; }
    button.submit { border:0; border-radius:12px; padding:13px 20px; color:#07111f; font-weight:800; background:linear-gradient(135deg,var(--accent2),#75b7ff); cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { color:var(--muted); }
    .result { margin-top:22px; padding-top:20px; border-top:1px solid var(--line); display:none; }
    audio { width:100%; }
    @media (max-width:760px) { header,.panel-head { flex-direction:column; align-items:start; } form { grid-template-columns:1fr; } .wide { grid-column:auto; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Seed-VC 实验台</h1><p class="lead">同一页面对比 v1.0 与 v2.0。v1.0 保留歌声与 F0 能力；v2.0 增加风格、情绪、口音转换及匿名化能力。</p></div>
    <span class="badge">ttd-edge · GPU2</span>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="v1">Seed-VC v1.0</button>
    <button class="tab" data-tab="v2">Seed-VC v2.0</button>
  </div>

  <section class="panel active" id="v1">
    <div class="panel-head"><div><h2>v1.0 · 音色 / 歌声转换</h2><p class="note">代理现有 svc-api 服务，适合普通 VC 和启用 F0 的歌声转换。</p></div></div>
    <form data-endpoint="/api/v1/convert">
      <label>源音频<input required type="file" name="source_file" accept="audio/*"></label>
      <label>参考音色<input required type="file" name="reference_file" accept="audio/*"></label>
      <label>扩散步数<input type="number" name="diffusion_steps" value="25" min="1" max="200"></label>
      <label>时长系数<input type="number" name="length_adjust" value="1.0" min="0.5" max="2" step="0.1"></label>
      <label>CFG<input type="number" name="inference_cfg_rate" value="0.7" min="0" max="1" step="0.1"></label>
      <label>升降调（半音）<input type="number" name="pitch_shift" value="0" min="-24" max="24"></label>
      <label class="check"><input type="checkbox" name="f0_conditioned">启用 F0（歌声转换）</label>
      <label class="check"><input type="checkbox" name="auto_f0_adjust">自动调整 F0</label>
      <div class="actions wide"><button class="submit" type="submit">运行 v1.0</button><span class="status">等待音频</span></div>
    </form>
    <div class="result"><audio controls></audio></div>
  </section>

  <section class="panel" id="v2">
    <div class="panel-head"><div><h2>v2.0 · 音色 / 风格 / 口音转换</h2><p class="note">模型首次请求会懒加载。勾选风格转换后启用 AR 模型；匿名化会生成模型定义的平均音色。</p></div></div>
    <form data-endpoint="/api/v2/convert">
      <label>源音频<input required type="file" name="source_file" accept="audio/*"></label>
      <label>参考音色<input required type="file" name="reference_file" accept="audio/*"></label>
      <label>扩散步数<input type="number" name="diffusion_steps" value="30" min="1" max="200"></label>
      <label>时长系数<input type="number" name="length_adjust" value="1.0" min="0.5" max="2" step="0.1"></label>
      <label>清晰度 CFG<input type="number" name="intelligibility_cfg_rate" value="0.0" min="0" max="1" step="0.1"></label>
      <label>相似度 CFG<input type="number" name="similarity_cfg_rate" value="0.7" min="0" max="1" step="0.1"></label>
      <label>Top-p<input type="number" name="top_p" value="0.9" min="0.1" max="1" step="0.1"></label>
      <label>Temperature<input type="number" name="temperature" value="1.0" min="0.1" max="2" step="0.1"></label>
      <label>重复惩罚<input type="number" name="repetition_penalty" value="1.0" min="1" max="3" step="0.1"></label>
      <label class="check"><input type="checkbox" name="convert_style">转换风格 / 情绪 / 口音</label>
      <label class="check"><input type="checkbox" name="anonymization_only">仅匿名化</label>
      <div class="actions wide"><button class="submit" type="submit">运行 v2.0</button><span class="status">等待音频</span></div>
    </form>
    <div class="result"><audio controls></audio></div>
  </section>
</main>
<script>
  document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('.tab,.panel').forEach(node => node.classList.remove('active'));
    button.classList.add('active'); document.getElementById(button.dataset.tab).classList.add('active');
  }));
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', async event => {
    event.preventDefault();
    const button=form.querySelector('.submit'), status=form.querySelector('.status'), result=form.parentElement.querySelector('.result'), audio=result.querySelector('audio');
    button.disabled=true; status.textContent='模型处理中，请勿重复提交…'; result.style.display='none';
    const data=new FormData(form);
    form.querySelectorAll('input[type=checkbox]').forEach(box => data.set(box.name, box.checked ? 'true' : 'false'));
    try {
      const response=await fetch(form.dataset.endpoint,{method:'POST',body:data});
      if(!response.ok){ let message=await response.text(); try{message=JSON.parse(message).detail||message}catch{} throw new Error(message); }
      const blob=await response.blob(); if(audio.src) URL.revokeObjectURL(audio.src); audio.src=URL.createObjectURL(blob); result.style.display='block'; status.textContent=`完成 · ${(blob.size/1024/1024).toFixed(2)} MB`;
    } catch(error) { status.textContent=`失败：${error.message}`; }
    finally { button.disabled=false; }
  }));
</script>
</body>
</html>
