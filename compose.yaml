services:
  svc-api-1:
    container_name: 'svc-api-1'
    build: .
    image: svc-api:latest
    environment:
      - LC_ALL=C.UTF-8
      - TZ=Asia/Shanghai
    volumes:
      - /TTD-Data/seed-vc:/data/ttd/seed-vc
      - /TTD-Data/seed-vc/checkpoints:/app/checkpoints
      - /TTD-Data/seed-vc/cache:/root/.cache
    working_dir: /app
    shm_size: 16G
    stdin_open: true
    tty: true
    restart: always
    labels:
      caddy_network: caddy
      caddy: http://svc-api
      caddy.reverse_proxy: "{{upstreams 7856}}"
    ports:
      - "7000:7856"
    networks:
      - caddy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "0" ]
              capabilities: [ gpu ]
